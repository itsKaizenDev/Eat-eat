  <path d="M640 520H800V300H960" fill="none" stroke="#7fcf34" stroke-width="22" stroke-dasharray="26 16" opacity=".9"/>
  <path d="M960 560H820V700H640" fill="none" stroke="#4aa3ff" stroke-width="22" stroke-dasharray="26 16" opacity=".9"/>
