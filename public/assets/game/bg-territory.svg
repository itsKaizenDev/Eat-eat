  <g fill="#000" opacity=".3"><circle cx="400" cy="520" r="14"/><circle cx="320" cy="440" r="14"/><circle cx="480" cy="600" r="14"/></g>
  <g stroke="#000" stroke-opacity=".3" stroke-width="10"><path d="M1160 340l60-60M1260 440l60-60M1100 500l60-60"/></g>
